[package]
name = "quat_gfx"
version = "0.1.0"
edition = "2024"
authors = ["Strale <strahinjastojanovic826@gmail.com>"]
description = "Multi-platform graphics library (DirectX 12, Vulkan, Metal) in Rust with 4-state management and C/C++/C# bindings."
readme = "README.md"
repository = "https://github.com/strahinjastojanovic826-code/quat_gfx"
license = "AGPL-3.0-or-later"
keywords = ["graphics", "vulkan", "directx", "metal", "rhi"]
categories = ["rendering", "graphics"]

[lib]
name = "quat_gfx"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
bitflags = "2.4"

[profile.release]
opt-level = 3
lto = true
